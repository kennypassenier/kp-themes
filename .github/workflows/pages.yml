name: Site

# MR5-PAGES: what is published is named here, and only that. A Pages site
# served from the repository root would publish docs/ as well — the scope
# documents, the correction log, the mini-round queue — which is not what
# "publish the site" meant.
#
# So the site is assembled here: the documentation site, the showcase,
# the example pages and exactly the directories they load from. Every one
# of those directories is written by a generator whose --check runs in
# the gate chain, so nothing here can carry a page nobody generated.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site _site/site
          cp -r showcase _site/showcase
          cp -r examples _site/examples
          cp -r css _site/css
          cp -r js _site/js
          cp -r dist _site/dist
          # The start page lives one directory down; the root redirects to
          # it so the Pages URL lands somewhere useful.
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=./site/">\n' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
