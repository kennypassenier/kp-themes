name: Documentation site

# S27: what is published is the generated site, with the showcase as one
# page in it. MR5-PAGES still holds — a Pages site served from the
# repository root would publish docs/ as well, the scope documents, the
# correction log, the mini-round queue — so the upload is assembled
# rather than taken whole.
#
# AR22: the site is committed, so nothing is generated here. And the list
# of what it needs beside its own pages lives in the generator
# (`node gates/generate-site.mjs --assets`), because two lists of what
# the site consists of means the CI one ships.

# The review site rides along under /review/ (Kenny, 2026-09-13: a fixed
# URL for the catalogue instead of a local server). It is taken from the
# round-six branch, where the catalogue and the research demos live, and
# carries only what those pages load — measured by loading all 23 of them:
# catalogue/, research/, css/, js/ and fonts/. The documentation stays the
# one on main, whichever branch the push came from.

on:
  push:
    branches: [main, round-six]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: round-six
          path: review
      - uses: actions/setup-node@v4
        with:
          node-version-file: main/.nvmrc
      # The site as committed matches the sources it was generated from;
      # publishing a stale one would put a page on the internet that no
      # gate ever read.
      - name: The committed site matches its source
        working-directory: main
        run: node gates/generate-site.mjs --check
      - name: Assemble the upload
        run: |
          mkdir -p _site
          cp -r main/site _site/site
          for asset in $(cd main && node gates/generate-site.mjs --assets); do
            cp -r "main/$asset" "_site/$asset"
          done
          # The site lives one directory down; the root redirects to it so
          # the Pages URL lands somewhere useful.
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=./site/">\n' > _site/index.html
          # The review site: the pages and what they load, nothing else —
          # docs/ stays out here as well (MR5-PAGES).
          mkdir -p _site/review
          for dir in catalogue research css js fonts; do
            cp -r "review/$dir" "_site/review/$dir"
          done
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=./catalogue/index.html">\n' > _site/review/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
