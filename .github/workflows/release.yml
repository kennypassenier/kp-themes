name: Release

# TH18: SHA256SUMS beside every release tag.
#
# This project signs nothing: there is no key baked into anything, because
# nothing here is an executable a consumer runs. The checksums are the
# whole verification story, and they answer the question a vendoring
# consumer actually has — "is this the file the tag says it is". kyu and almanac vendor
# css/themes.css into a Rust binary's static directory rather than
# installing it, so they have no npm to verify anything for them.
#
# The checksums are generated here rather than committed: they would
# change on every stylesheet edit, and a file that is wrong between
# commits is worse than no file.
#
# M1 as amended on 2026-09-06: a release also carries the dist bundle, so
# the consumer who wants two tags instead of eight can take them from the
# release rather than from npm. And the checksum file covers every file a
# consumer can copy rather than a hand-picked few -- the fault recorded as
# KT9, where three of ten files were attached by hand.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # The tag must pass the same gates as a commit. A release built from
      # a tree that does not pass is a release of something else.
      #
      # This runs `npm run gates` rather than the hook script, decided at
      # round five's Phase 5 gate (H2). KT7 was about two lists of checks
      # that promised the same thing with nothing laying them side by
      # side; this workflow was a third such list, held by no test at all,
      # and it was the one that builds a tag. The KT7 unit test now
      # asserts all three.
      - name: Gates
        run: npm run gates
      - name: Checksums
        run: npm run checksums
      # The shipped fonts as one asset [T19, AR39]: every woff2 and LICENSE
      # under fonts/, with families.json, so a consumer that vendors a
      # stylesheet takes the faces in one download.
      - name: Fonts
        run: tar -cf fonts.tar fonts
      # The consumer tarball [CF1, 2026-09-09]. chassis-rs pulled thirty-odd
      # files off the git tag one by one because the release attached eight
      # assets while SHA256SUMS beside them named 231 copyable files. This
      # is built FROM that manifest, so its contents cannot go stale.
      - name: Consumer tarball
        run: npm run consumer-tar
      # A draft, never a published release. Pushing a tag is a technical
      # act; publishing is Kenny's, and the two should not be the same
      # keystroke. A draft can also be deleted without leaving a hole in
      # the release list.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md \
            SHA256SUMS MIGRATION.md css/themes.css css/components.css css/fonts.css \
            dist/kp-themes.css dist/kp-themes.js fonts.tar consumer.tar
