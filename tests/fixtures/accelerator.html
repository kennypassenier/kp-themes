<!doctype html>
<html lang="en" data-theme="retro">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Accelerator fixture</title>
        <link rel="stylesheet" href="/css/fonts.css" />
        <link rel="stylesheet" href="/css/themes.css" />
        <link rel="stylesheet" href="/css/components.css" />
        <link rel="stylesheet" href="/css/retro-register.css" />
    </head>
    <body>
        <main>
            <h1>The accelerator</h1>
            <!-- What retro's hover gesture asks of a consumer [gap-4]: one
                 letter marked with data-kp-key inside the label. A consumer
                 who marks nothing sees nothing, which is why the second
                 button is here unmarked. -->
            <button type="button" class="kp-button" id="marked">
                <span class="kp-button__label"><span data-kp-key>V</span>erstuur</span>
            </button>
            <button type="button" class="kp-button" id="plain">
                <span class="kp-button__label">Annuleer</span>
            </button>
        </main>
    </body>
</html>
