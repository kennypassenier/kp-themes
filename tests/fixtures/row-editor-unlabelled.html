<!doctype html>
<html lang="en" data-theme="formal">
    <head>
        <meta charset="utf-8" />
        <title>A time field and a weekday picker without a label of their own [rownames-1104]</title>
        <link rel="stylesheet" href="/css/fonts.css" />
        <link rel="stylesheet" href="/css/themes.css" />
        <link rel="stylesheet" href="/css/components.css" />
        <link rel="stylesheet" href="/css/formal-register.css" />
    </head>
    <body>
        <!-- No data-kp-label and no aria-label: the generated button and group keep their generic names. -->
        <main>
            <div class="kp-time" data-kp-time data-kp-untracked data-kp-value="08:00"></div>
            <div class="kp-weekdays" data-kp-weekdays data-kp-untracked data-kp-value="1,2"></div>
        </main>
        <script type="module" src="/js/auto.js"></script>
    </body>
</html>
