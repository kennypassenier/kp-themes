<!doctype html>
<html lang="en" data-theme="formal">
    <head>
        <meta charset="utf-8" />
        <title>Row editor: a number in every control's accessible name [js-1104]</title>
        <link rel="stylesheet" href="/css/fonts.css" />
        <link rel="stylesheet" href="/css/themes.css" />
        <link rel="stylesheet" href="/css/components.css" />
        <link rel="stylesheet" href="/css/formal-register.css" />
    </head>
    <body>
        <!-- Medicine Cabinet's schedule editor: a time field, a weekday picker and a quantity per row. `{n}` in an attribute of a
             row (markup or template) is that row's number; each control names itself from its own attribute. -->
        <main>
            <div class="kp-rows" data-kp-rows data-kp-rows-min="1" data-kp-rows-max="6" data-kp-rows-unit="time,times" aria-label="When to take it" id="editor">
                <ol class="kp-rows__list" data-kp-rows-list>
                    <li class="kp-rows__row">
                        <div class="kp-rows__cell" data-label="Time"><div class="kp-time" data-kp-time data-kp-untracked data-kp-name="at-{n}" data-kp-value="08:00" data-kp-label="Time of dose {n}" data-kp-time-step="5"></div></div>
                        <div class="kp-rows__cell" data-label="Days"><div class="kp-weekdays" data-kp-weekdays data-kp-untracked data-kp-value="1,2" data-kp-presets="false" data-kp-summary="false" aria-label="Days of dose {n}"></div></div>
                        <div class="kp-rows__cell" data-label="Dose"><div class="kp-quantity" data-kp-quantity data-kp-untracked data-kp-quantity-fill data-kp-quantity-min="0.25" data-kp-quantity-step="0.25" data-kp-quantity-unit="pills" data-kp-quantity-unit-one="pill" data-kp-quantity-label="Amount of dose {n}"><input class="kp-quantity__input" autocomplete="off" value="1" /></div></div>
                    </li>
                </ol>
                <template data-kp-rows-template>
                    <li class="kp-rows__row">
                        <div class="kp-rows__cell" data-label="Time"><div class="kp-time" data-kp-time data-kp-untracked data-kp-name="at-{n}" data-kp-value="08:00" data-kp-label="Time of dose {n}" data-kp-time-step="5"></div></div>
                        <div class="kp-rows__cell" data-label="Days"><div class="kp-weekdays" data-kp-weekdays data-kp-untracked data-kp-value="1,2" data-kp-presets="false" data-kp-summary="false" aria-label="Days of dose {n}"></div></div>
                        <div class="kp-rows__cell" data-label="Dose"><div class="kp-quantity" data-kp-quantity data-kp-untracked data-kp-quantity-fill data-kp-quantity-min="0.25" data-kp-quantity-step="0.25" data-kp-quantity-unit="pills" data-kp-quantity-unit-one="pill" data-kp-quantity-label="Amount of dose {n}"><input class="kp-quantity__input" autocomplete="off" value="1" /></div></div>
                    </li>
                </template>
            </div>
        </main>
        <script type="module" src="/js/auto.js"></script>
    </body>
</html>
