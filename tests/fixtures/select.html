<!doctype html>
<html lang="en" data-theme="formal">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Drawn select — both channels, every theme</title>
        <link rel="stylesheet" href="/css/themes.css" />
        <link rel="stylesheet" href="/css/components.css" />
        <!-- Every register, and no stylesheet of the page's own: everything
             measured here comes from the package (rule 7e, KT3). -->
        <link rel="stylesheet" href="/css/cyberpunk-register.css" />
        <link rel="stylesheet" href="/css/retro-register.css" />
        <link rel="stylesheet" href="/css/synthwave-register.css" />
        <link rel="stylesheet" href="/css/phantom-register.css" />
        <link rel="stylesheet" href="/css/terminal-register.css" />
        <link rel="stylesheet" href="/css/brutalism-register.css" />
        <link rel="stylesheet" href="/css/titanium-register.css" />
        <link rel="stylesheet" href="/css/pastel-register.css" />
        <link rel="stylesheet" href="/css/shade-light-register.css" />
        <link rel="stylesheet" href="/css/forest-register.css" />
        <link rel="stylesheet" href="/css/deco-register.css" />
        <link rel="stylesheet" href="/css/light-register.css" />
        <link rel="stylesheet" href="/css/grotesk-register.css" />
        <link rel="stylesheet" href="/css/blueprint-register.css" />
        <link rel="stylesheet" href="/css/nostromo-register.css" />
        <link rel="stylesheet" href="/css/dark-register.css" />
        <link rel="stylesheet" href="/css/formal-register.css" />
        <link rel="stylesheet" href="/css/sepia-register.css" />
        <link rel="stylesheet" href="/css/solstice-register.css" />
        <link rel="stylesheet" href="/css/high-contrast-register.css" />
        <link rel="stylesheet" href="/css/lapis-register.css" />
        <link rel="stylesheet" href="/css/shade-dark-register.css" />
    </head>
    <body>
        <!-- The framework-free half: the markup a server writes. -->
        <section id="plain">
            <form data-test="plain-form">
                <div class="kp-field">
                    <label class="kp-field__label" for="plain-severity">Severity</label>
                    <select class="kp-field__input" id="plain-severity" name="severity" data-kp-select data-test="plain-select">
                        <option value="low">Low</option>
                        <option value="high" selected>High</option>
                        <option value="blocked" disabled>Blocked</option>
                        <option value="critical">Critical — wake the on-call engineer</option>
                    </select>
                </div>
                <div class="kp-field">
                    <label class="kp-field__label" for="plain-native">Region</label>
                    <select class="kp-field__input" id="plain-native" name="region" data-test="plain-native">
                        <option>North</option>
                        <option>South</option>
                    </select>
                </div>
            </form>
        </section>

        <section id="react">
            <div id="react-select"></div>
        </section>

        <!-- The combobox list the drawn one must look like, open, last on the page so
             it covers nothing a test clicks. -->
        <section id="reference">
            <div class="kp-combobox">
                <label class="kp-field__label" for="ref-input">Reference</label>
                <input class="kp-combobox__input" id="ref-input" type="text" role="combobox" aria-expanded="true" aria-controls="ref-list" />
                <ul class="kp-combobox__list" id="ref-list" role="listbox" data-test="reference-list">
                    <li class="kp-combobox__option" role="option" aria-selected="false">Low</li>
                </ul>
            </div>
        </section>

        <script type="module" src="/js/auto.js"></script>
        <script type="module" src="/tests/fixtures/.build/react-select.js"></script>
    </body>
</html>
