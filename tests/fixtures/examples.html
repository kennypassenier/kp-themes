<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>kp-themes — example pages, React channel</title>
        <!-- The head snippet the generated pages carry: the stored theme
             before the stylesheet, and the effects armed before first
             paint [AR34]. -->
        <script>
            (function () {
                try {
                    var t = localStorage.getItem('theme');
                    if (t) document.documentElement.setAttribute('data-theme', t);
                    document.documentElement.setAttribute('data-kp-effects', '');
                } catch (e) {}
            })();
        </script>
        <link rel="stylesheet" href="/css/fonts.css" />
        <link rel="stylesheet" href="/css/themes.css" />
        <link rel="stylesheet" href="/css/components.css" />
        <link rel="stylesheet" href="/css/layout.css" />
        <link rel="stylesheet" href="/css/utilities.css" />
        <link rel="stylesheet" href="/css/cyberpunk-register.css" />
        <link rel="stylesheet" href="/css/retro-register.css" />
        <link rel="stylesheet" href="/css/synthwave-register.css" />
        <link rel="stylesheet" href="/css/phantom-register.css" />
        <link rel="stylesheet" href="/css/terminal-register.css" />
        <link rel="stylesheet" href="/css/brutalism-register.css" />
        <link rel="stylesheet" href="/css/shade-dark-register.css" />
    </head>
    <body>
        <!-- The same seven stylesheets the generated pages load and nothing
             else [KT3, KT8]: a fixture that styled anything itself would be
             supplying the very thing under test. -->
        <div id="react-mount"></div>
        <script type="module" src="./.build/examples-react.js"></script>
    </body>
</html>
