<!doctype html>
<html lang="en" data-theme="formal">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>A side navigation that can be put away</title>
        <link rel="stylesheet" href="/css/themes.css" />
        <link rel="stylesheet" href="/css/layout.css" />
        <link rel="stylesheet" href="/css/components.css" />
    </head>
    <body>
        <!-- Three sidebars, because the feature has three states and the
             width decides two of them. The boxes are sized here rather
             than by the viewport: the rule steps at the container query
             the package already uses — 40rem — and a container query reads
             its box, not the window.

             No stylesheet of this page's own beyond those two widths
             (rule 7e, KT3): everything under test has to come from
             css/layout.css or the test is measuring its own scaffolding. -->

        <!-- Wide: the aside is on the screen and the toggle takes it away. -->
        <div style="inline-size: 900px">
            <div class="kp-sidebar" data-kp-sidebar data-test="wide">
                <button type="button" class="kp-sidebar__toggle" data-kp-sidebar-toggle data-test="wide-toggle">Menu</button>
                <nav class="kp-sidebar__aside" data-test="wide-aside" aria-label="Sections">
                    <a href="#a">One</a>
                </nav>
                <main class="kp-sidebar__main" data-test="wide-main">
                    <p>The column the aside stands beside.</p>
                </main>
            </div>
        </div>

        <!-- Narrow: the aside is away and the toggle brings it back, over
             the text. -->
        <div style="inline-size: 360px">
            <div class="kp-sidebar" data-kp-sidebar data-test="narrow">
                <button type="button" class="kp-sidebar__toggle" data-kp-sidebar-toggle data-test="narrow-toggle">Menu</button>
                <nav class="kp-sidebar__aside" data-test="narrow-aside" aria-label="Sections">
                    <a href="#a">One</a>
                </nav>
                <main class="kp-sidebar__main" data-test="narrow-main">
                    <p>The column the aside covers when it opens.</p>
                </main>
            </div>
        </div>

        <!-- The same narrow box with the knob that pushes instead. -->
        <div style="inline-size: 360px">
            <div class="kp-sidebar kp-sidebar--push" data-kp-sidebar data-test="push">
                <button type="button" class="kp-sidebar__toggle" data-kp-sidebar-toggle data-test="push-toggle">Menu</button>
                <nav class="kp-sidebar__aside" data-test="push-aside" aria-label="Sections">
                    <a href="#a">One</a>
                </nav>
                <main class="kp-sidebar__main" data-test="push-main">
                    <p>The column the aside pushes down when it opens.</p>
                </main>
            </div>
        </div>

        <!-- The fourth state: a wide box that is asked to remember. The
             key is this page's own, so nothing else on it is touched. -->
        <div style="inline-size: 900px">
            <div class="kp-sidebar" data-kp-sidebar data-kp-sidebar-remember="kp-test-sidebar" data-test="memo">
                <button type="button" class="kp-sidebar__toggle" data-kp-sidebar-toggle data-test="memo-toggle">Menu</button>
                <nav class="kp-sidebar__aside" data-test="memo-aside" aria-label="Sections">
                    <a href="#a">One</a>
                </nav>
                <main class="kp-sidebar__main" data-test="memo-main">
                    <p>The column that finds the aside the way it left it.</p>
                </main>
            </div>
        </div>

        <!-- The fifth: no width of its own, so it follows the viewport and
             a test can walk it across the 40rem step without touching a
             button. What the button ANNOUNCES has to follow the paint. -->
        <div class="kp-sidebar" data-kp-sidebar data-test="fluid">
            <button type="button" class="kp-sidebar__toggle" data-kp-sidebar-toggle data-test="fluid-toggle">Menu</button>
            <nav class="kp-sidebar__aside" data-test="fluid-aside" aria-label="Sections">
                <a href="#a">One</a>
            </nav>
            <main class="kp-sidebar__main" data-test="fluid-main">
                <p>The column that follows the window.</p>
            </main>
        </div>

        <script type="module" src="/js/auto.js"></script>
    </body>
</html>
