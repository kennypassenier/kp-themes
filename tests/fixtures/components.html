<!doctype html>
<html lang="nl" data-theme="formal">
    <head>
        <meta charset="utf-8" />
        <title>Components — both channels</title>
        <link rel="stylesheet" href="/css/themes.css" />
        <link rel="stylesheet" href="/css/components.css" />
    </head>
    <body>
        <h1>Contracten, twee kanalen</h1>

        <section id="plain">
            <h2>Framework-free</h2>
            <nav class="kp-nav">
                <span class="kp-nav__brand">kp</span>
                <ul class="kp-nav__links">
                    <li><a class="kp-nav__link" href="#a" aria-current="page">Een</a></li>
                </ul>
            </nav>
            <button type="button" class="kp-button" data-test="plain">Gewoon</button>
            <button type="button" class="kp-button kp-button--primary" data-test="primary">Primair</button>
            <!-- Destructive with neither undo nor confirmation: the case
                 this suite exists to catch. -->
            <button type="button" class="kp-button kp-button--destructive" data-kp-destructive data-test="destructive-bare">Verwijderen</button>
            <button
                type="button"
                class="kp-button kp-button--destructive"
                data-kp-destructive
                data-kp-confirm="Zeker?"
                data-test="destructive-confirm"
                onclick="window.__acted && window.__acted('plain')"
            >
                Verwijderen
            </button>
            <button type="button" class="kp-button kp-button--destructive" data-kp-destructive data-kp-undo data-test="destructive-undo">
                Verwijderen
            </button>
            <span
                class="kp-badge"
                data-kp-semantic
                data-status="offer"
                data-test="badge-labelled"
                style="background: var(--status-offer); color: var(--status-offer-foreground)"
                >Aanbod</span
            >
            <span
                class="kp-badge"
                data-kp-semantic
                data-status="rejected"
                data-test="badge-bare"
                style="background: var(--status-rejected); color: var(--status-rejected-foreground)"
            ></span>
            <div class="kp-alert kp-alert--warning" role="status" data-kp-semantic data-test="alert">
                <span><span class="kp-alert__label">Let op: </span>Let op deze zaak.</span>
            </div>
            <div class="kp-card" data-slot="card" data-test="card">
                <h3 class="kp-card__title">Kaart</h3>
                <div class="kp-card__body">Inhoud</div>
            </div>
            <button type="button" class="kp-button" data-kp-dialog="plain-dialog" data-test="dialog-open">Dialoog openen</button>
            <dialog class="kp-dialog" id="plain-dialog" data-test="dialog">
                <h2 class="kp-dialog__title">Bevestigen</h2>
                <p>Een dialoog die het toetsenbord zelf afhandelt.</p>
                <div class="kp-dialog__actions">
                    <button type="button" class="kp-button" data-kp-dialog-close data-test="dialog-close">Sluiten</button>
                </div>
            </dialog>

            <div class="kp-tabs">
                <div class="kp-tabs__list" role="tablist" data-test="tablist">
                    <button type="button" class="kp-tab" role="tab" id="p-t0" aria-controls="p-p0" aria-selected="true" data-test="tab-0">Een</button>
                    <button type="button" class="kp-tab" role="tab" id="p-t1" aria-controls="p-p1" aria-selected="false" data-test="tab-1">
                        Twee
                    </button>
                </div>
                <div class="kp-tabs__panel" role="tabpanel" id="p-p0" aria-labelledby="p-t0" data-test="panel-0">Paneel een</div>
                <div class="kp-tabs__panel" role="tabpanel" id="p-p1" aria-labelledby="p-t1" data-test="panel-1" hidden>Paneel twee</div>
            </div>
        </section>

        <section>
            <h2>React</h2>
            <div id="react-components"></div>
        </section>

        <section id="plain-combobox">
            <h2>Combobox, framework-free</h2>
            <div class="kp-combobox" data-kp-combobox data-test="plain-combobox">
                <label class="kp-field__label" for="fruit">Fruit</label>
                <input
                    class="kp-combobox__input"
                    id="fruit"
                    type="text"
                    role="combobox"
                    aria-expanded="false"
                    aria-controls="fruit-list"
                    autocomplete="off"
                    data-test="plain-combobox-input"
                />
                <ul class="kp-combobox__list" id="fruit-list" role="listbox" hidden>
                    <li class="kp-combobox__option" role="option" data-kp-option data-value="appel">Appel</li>
                    <li class="kp-combobox__option" role="option" data-kp-option data-value="banaan">Banaan</li>
                    <li class="kp-combobox__option" role="option" data-kp-option data-value="citroen">Citroen</li>
                </ul>
                <p class="kp-combobox__status" data-kp-combobox-status role="status" aria-live="polite"></p>
            </div>

            <div class="kp-combobox" data-kp-combobox data-kp-tags data-test="plain-tags">
                <label class="kp-field__label" for="labels">Labels</label>
                <ul class="kp-tag-list" data-kp-tag-list></ul>
                <input
                    class="kp-combobox__input"
                    id="labels"
                    type="text"
                    role="combobox"
                    aria-expanded="false"
                    aria-controls="labels-list"
                    autocomplete="off"
                    data-test="plain-tags-input"
                />
                <ul class="kp-combobox__list" id="labels-list" role="listbox" hidden>
                    <li class="kp-combobox__option" role="option" data-kp-option data-value="urgent">Urgent</li>
                    <li class="kp-combobox__option" role="option" data-kp-option data-value="bug">Bug</li>
                    <li class="kp-combobox__option" role="option" data-kp-option data-value="idee">Idee</li>
                </ul>
                <p class="kp-combobox__status" data-kp-combobox-status role="status" aria-live="polite"></p>
            </div>
        </section>

        <script type="module" src="/js/components.js"></script>
        <script type="module" src="/js/overlays.js"></script>
        <script type="module" src="/js/combobox.js"></script>
        <script type="module" src="/tests/fixtures/.build/react-components.js"></script>
    </body>
</html>
