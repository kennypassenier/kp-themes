<!doctype html>
<html lang="en" data-theme="formal">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>The divider shape knob</title>
        <link rel="stylesheet" href="/css/themes.css" />
        <link rel="stylesheet" href="/css/components.css" />
        <link rel="stylesheet" href="/css/layout.css" id="layout" />
        <link rel="stylesheet" href="/css/formal-register.css" />
        <link rel="stylesheet" href="/css/light-register.css" />
        <link rel="stylesheet" href="/css/dark-register.css" />
        <link rel="stylesheet" href="/css/cyberpunk-register.css" />
        <link rel="stylesheet" href="/css/synthwave-register.css" />
        <link rel="stylesheet" href="/css/pastel-register.css" />
        <link rel="stylesheet" href="/css/terminal-register.css" />
        <link rel="stylesheet" href="/css/forest-register.css" />
        <link rel="stylesheet" href="/css/high-contrast-register.css" />
        <link rel="stylesheet" href="/css/sepia-register.css" />
        <link rel="stylesheet" href="/css/blueprint-register.css" />
        <link rel="stylesheet" href="/css/solstice-register.css" />
        <link rel="stylesheet" href="/css/brutalism-register.css" />
        <link rel="stylesheet" href="/css/deco-register.css" />
        <link rel="stylesheet" href="/css/phantom-register.css" />
        <link rel="stylesheet" href="/css/shade-light-register.css" />
        <link rel="stylesheet" href="/css/shade-dark-register.css" />
        <link rel="stylesheet" href="/css/retro-register.css" />
        <link rel="stylesheet" href="/css/grotesk-register.css" />
        <link rel="stylesheet" href="/css/lapis-register.css" />
        <link rel="stylesheet" href="/css/nostromo-register.css" />
        <link rel="stylesheet" href="/css/titanium-register.css" />
    </head>
    <body>
        <!-- The divider shape knob [scope-93]. This page loads the package and
             every register and styles nothing itself [KT3]: what a divider
             draws here comes from css/layout.css or from the register. -->

        <!-- The concept page's seams, with no shape named anywhere: every
             theme's own drawing. -->
        <div data-test="plain">
            <section data-kp-surface="hero"><p>The hero ends here.</p></section>
            <div data-kp-divider data-test="plain-divider"></div>
            <section data-kp-surface="app"><p>The working surface ends here.</p></section>
            <div data-kp-divider="alt" data-test="plain-alt"></div>
            <footer class="kp-footer"><p>Handover log</p></footer>
        </div>

        <!-- The same seams, for a test to name a shape on. -->
        <div data-test="shaped">
            <section data-kp-surface="hero"><p>The hero ends here.</p></section>
            <div data-kp-divider data-test="shaped-divider"></div>
            <section data-kp-surface="app"><p>The working surface ends here.</p></section>
            <div data-kp-divider="alt" data-test="shaped-alt"></div>
            <footer class="kp-footer"><p>Handover log</p></footer>
        </div>

        <!-- Every value at once, one row each. -->
        <div data-test="every">
            <div data-kp-divider-shape="zigzag">
                <div data-kp-divider></div>
                <div data-kp-divider="alt"></div>
            </div>
            <div data-kp-divider-shape="scallop">
                <div data-kp-divider></div>
                <div data-kp-divider="alt"></div>
            </div>
            <div data-kp-divider-shape="wave">
                <div data-kp-divider></div>
                <div data-kp-divider="alt"></div>
            </div>
            <div data-kp-divider-shape="cloud">
                <div data-kp-divider></div>
                <div data-kp-divider="alt"></div>
            </div>
            <div data-kp-divider-shape="pearls">
                <div data-kp-divider></div>
                <div data-kp-divider="alt"></div>
            </div>
            <div data-kp-divider-shape="line">
                <div data-kp-divider></div>
                <div data-kp-divider="alt"></div>
            </div>
            <div data-kp-divider-shape="none">
                <div data-kp-divider></div>
                <div data-kp-divider="alt"></div>
            </div>
        </div>

        <!-- Nesting: the nearest element that names a shape wins. -->
        <div data-kp-divider-shape="wave" data-test="nest">
            <div data-kp-divider data-test="nest-wave"></div>
            <div data-kp-divider data-kp-divider-shape="pearls" data-test="nest-own"></div>
            <div data-kp-divider-shape="theme">
                <div data-kp-divider data-test="nest-theme"></div>
                <div data-kp-divider-shape="scallop"><div data-kp-divider data-test="nest-deep"></div></div>
            </div>
            <div>
                <div data-kp-divider data-kp-divider-shape="theme" data-test="nest-own-theme"></div>
                <div></div>
            </div>
        </div>

        <!-- What a divider with no shape draws in the same place among its
             siblings, first child with one element after it, to compare the
             value theme against. -->
        <div>
            <div data-kp-divider data-test="reference"></div>
            <div></div>
        </div>
    </body>
</html>
