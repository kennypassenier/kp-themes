<!doctype html>
<html lang="en" data-theme="formal">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Alarm — both channels, every theme</title>
        <link rel="stylesheet" href="/css/fonts.css" />
        <link rel="stylesheet" href="/css/themes.css" />
        <link rel="stylesheet" href="/css/components.css" />
        <!-- Every register, and no stylesheet of the page's own: everything
             measured here comes from the package (rule 7e, KT3). -->
        <link rel="stylesheet" href="/css/cyberpunk-register.css" />
        <link rel="stylesheet" href="/css/retro-register.css" />
        <link rel="stylesheet" href="/css/synthwave-register.css" />
        <link rel="stylesheet" href="/css/phantom-register.css" />
        <link rel="stylesheet" href="/css/terminal-register.css" />
        <link rel="stylesheet" href="/css/brutalism-register.css" />
        <link rel="stylesheet" href="/css/titanium-register.css" />
        <link rel="stylesheet" href="/css/pastel-register.css" />
        <link rel="stylesheet" href="/css/shade-light-register.css" />
        <link rel="stylesheet" href="/css/forest-register.css" />
        <link rel="stylesheet" href="/css/deco-register.css" />
        <link rel="stylesheet" href="/css/light-register.css" />
        <link rel="stylesheet" href="/css/grotesk-register.css" />
        <link rel="stylesheet" href="/css/blueprint-register.css" />
        <link rel="stylesheet" href="/css/nostromo-register.css" />
        <link rel="stylesheet" href="/css/dark-register.css" />
        <link rel="stylesheet" href="/css/formal-register.css" />
        <link rel="stylesheet" href="/css/sepia-register.css" />
        <link rel="stylesheet" href="/css/solstice-register.css" />
        <link rel="stylesheet" href="/css/high-contrast-register.css" />
        <link rel="stylesheet" href="/css/lapis-register.css" />
        <link rel="stylesheet" href="/css/shade-dark-register.css" />
    </head>
    <body>
        <main>
            <h1>Pump house 4</h1>
            <p>The page behind the alarm. Its button counts presses, so a test can tell whether the page was reachable while an alarm was open.</p>
            <button type="button" class="kp-button" data-test="behind">Behind the alarm</button>
            <output data-test="behind-count">0</output>

            <!-- The framework-free half: showAlarm() through the page script,
                 and a declarative trigger attached by js/auto.js. -->
            <section id="plain">
                <button type="button" class="kp-button kp-button--destructive" data-test="plain-ack">Raise, acknowledged</button>
                <button type="button" class="kp-button" data-test="plain-ack-escape">Raise, acknowledged with Escape</button>
                <button type="button" class="kp-button" data-test="plain-auto">Raise, closes by itself</button>
                <button
                    type="button"
                    class="kp-button"
                    data-test="plain-declarative"
                    data-kp-alarm="Intrusion detected"
                    data-kp-alarm-code="Perimeter · east wing"
                    data-kp-alarm-detail="Unrecognised key presented at the east service door."
                    data-kp-alarm-mode="auto"
                    data-kp-alarm-seconds="2"
                >
                    Declarative trigger
                </button>
                <output data-test="plain-result"></output>
            </section>

            <!-- The React half: useAlarm() and the same three cases. -->
            <section id="react">
                <div id="react-alarm"></div>
            </section>
        </main>

        <script type="module" src="/js/auto.js"></script>
        <script type="module">
            import { showAlarm, ALARM_CLOSE_EVENT } from '/js/alarm.js';

            const behind = document.querySelector('[data-test="behind"]');
            const count = document.querySelector('[data-test="behind-count"]');
            behind.addEventListener('click', () => (count.textContent = String(Number(count.textContent) + 1)));

            const result = document.querySelector('[data-test="plain-result"]');
            const CASES = {
                'plain-ack': { mode: 'ack' },
                'plain-ack-escape': { mode: 'ack', escape: true },
                'plain-auto': { mode: 'auto', seconds: 2 },
            };
            window.kpAlarmOptions = {
                title: 'Access denied',
                code: 'Security protocol 7 · lockout',
                detail: 'Three failed attempts on terminal 4. This console is locked for ten minutes.',
            };
            for (const [id, extra] of Object.entries(CASES)) {
                document.querySelector(`[data-test="${id}"]`).addEventListener('click', async () => {
                    result.textContent = '';
                    result.textContent = await showAlarm({ ...window.kpAlarmOptions, ...extra });
                });
            }
            document.addEventListener(ALARM_CLOSE_EVENT, (event) => {
                if (event.target?.dataset?.test === 'plain-declarative') result.textContent = event.detail.reason;
            });
            window.showAlarm = showAlarm;
        </script>
        <script type="module" src="/tests/fixtures/.build/react-alarm.js"></script>
    </body>
</html>
