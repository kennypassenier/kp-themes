<!doctype html>
<html lang="en" data-theme="formal">
    <head>
        <meta charset="utf-8" />
        <title>Data table features — both channels [gap-13]</title>
        <link rel="stylesheet" href="/css/fonts.css" />
        <link rel="stylesheet" href="/css/themes.css" />
        <link rel="stylesheet" href="/css/components.css" />
        <link rel="stylesheet" href="/css/formal-register.css" />
        <link rel="stylesheet" href="/css/light-register.css" />
        <link rel="stylesheet" href="/css/dark-register.css" />
        <link rel="stylesheet" href="/css/cyberpunk-register.css" />
        <link rel="stylesheet" href="/css/synthwave-register.css" />
        <link rel="stylesheet" href="/css/pastel-register.css" />
        <link rel="stylesheet" href="/css/terminal-register.css" />
        <link rel="stylesheet" href="/css/forest-register.css" />
        <link rel="stylesheet" href="/css/high-contrast-register.css" />
        <link rel="stylesheet" href="/css/sepia-register.css" />
        <link rel="stylesheet" href="/css/blueprint-register.css" />
        <link rel="stylesheet" href="/css/solstice-register.css" />
        <link rel="stylesheet" href="/css/brutalism-register.css" />
        <link rel="stylesheet" href="/css/deco-register.css" />
        <link rel="stylesheet" href="/css/phantom-register.css" />
        <link rel="stylesheet" href="/css/shade-light-register.css" />
        <link rel="stylesheet" href="/css/shade-dark-register.css" />
        <link rel="stylesheet" href="/css/retro-register.css" />
        <link rel="stylesheet" href="/css/grotesk-register.css" />
        <link rel="stylesheet" href="/css/lapis-register.css" />
        <link rel="stylesheet" href="/css/nostromo-register.css" />
        <link rel="stylesheet" href="/css/titanium-register.css" />
    </head>
    <body>
        <h1>Data table features, two channels</h1>

        <!-- The features Kenny approved on 2026-09-13 and the eight faults of
             gap-13, written once per channel with the same data-test names
             so one suite drives both [AR7]. The rows come from
             datatable-data.mjs in both halves. The only styling here is a
             width on two hosts, because a squeezed column and a sticky
             header need a box of a known size; the package supplies
             everything else [KT3]. -->

        <!-- The package's own checkbox, the paint a data table's boxes must
             match in every theme [gap-13, Kenny's note]. -->
        <div class="kp-field kp-field--check" data-test="reference-check">
            <input class="kp-field__check" type="checkbox" id="ref-off" />
            <label class="kp-field__label" for="ref-off">Reference, unticked</label>
        </div>
        <div class="kp-field kp-field--check" data-test="reference-check-on">
            <input class="kp-field__check" type="checkbox" id="ref-on" checked />
            <label class="kp-field__label" for="ref-on">Reference, ticked</label>
        </div>

        <section id="plain">
            <h2>Framework-free</h2>
            <div class="kp-datatable" data-kp-datatable data-kp-cards data-test="plain-datatable">
                <div class="kp-datatable__bar">
                    <input class="kp-datatable__search" type="search" data-kp-datatable-search aria-label="Search incidents" />
                    <select class="kp-field__input kp-datatable__select" data-kp-datatable-scope></select>
                    <select class="kp-field__input kp-datatable__select" data-kp-datatable-density></select>
                </div>
                <div class="kp-datatable__actions" data-kp-datatable-actions hidden>
                    <span data-kp-datatable-selected-count></span>
                    <button type="button" class="kp-button kp-button--ghost" data-kp-datatable-clear-selection>Clear selection</button>
                </div>
                <div class="kp-datatable__loading" data-kp-datatable-loading hidden>
                    <span class="kp-skeleton"></span>
                    <span class="kp-skeleton"></span>
                </div>
                <div class="kp-alert kp-alert--destructive" data-kp-datatable-failed hidden>
                    <p>The incidents could not be loaded.</p>
                    <button type="button" class="kp-button" data-kp-datatable-retry>Try again</button>
                </div>
                <div class="kp-table-wrap">
                    <table class="kp-table">
                        <caption>
                            Incidents
                        </caption>
                        <thead>
                            <tr>
                                <th scope="col"><input type="checkbox" data-kp-select-all /></th>
                                <th scope="col" data-kp-sort="text">Reference</th>
                                <th scope="col" data-kp-sort="text" data-kp-filter="choice">Site</th>
                                <th scope="col" data-kp-sort="text" data-kp-filter="choice">Status</th>
                                <th scope="col" data-kp-sort="text" data-kp-filter="choice" data-kp-sort-order="Low,Medium,High,Critical">
                                    Severity
                                </th>
                                <th scope="col" data-kp-sort="number" data-kp-filter="range">Hours</th>
                                <th scope="col" data-kp-sort="date" data-kp-filter="date">Opened</th>
                                <th scope="col">Note</th>
                            </tr>
                        </thead>
                        <tbody data-fixture-rows></tbody>
                    </table>
                </div>
                <div class="kp-empty" data-kp-datatable-empty hidden>
                    <p>No incident matches.</p>
                    <button type="button" class="kp-button kp-button--secondary" data-kp-datatable-clear>Clear the search and filters</button>
                </div>
                <div class="kp-datatable__bar">
                    <p class="kp-datatable__status" data-kp-datatable-status role="status" aria-live="polite"></p>
                    <div class="kp-datatable__pager" data-kp-datatable-pager></div>
                </div>
            </div>

            <div style="inline-size: 34rem" data-test="plain-squeezed">
                <div class="kp-datatable" data-kp-datatable data-kp-max-height="12rem" data-test="plain-sticky">
                    <div class="kp-table-wrap">
                        <table class="kp-table">
                            <caption>
                                Incidents, in a short box
                            </caption>
                            <thead>
                                <tr>
                                    <th scope="col" data-kp-sort="text">Reference</th>
                                    <th scope="col">Site</th>
                                    <th scope="col">Status</th>
                                    <th scope="col">Note</th>
                                </tr>
                            </thead>
                            <tbody data-fixture-short-rows></tbody>
                        </table>
                    </div>
                    <div class="kp-datatable__bar">
                        <p class="kp-datatable__status" data-kp-datatable-status role="status" aria-live="polite"></p>
                    </div>
                </div>
            </div>
        </section>

        <section>
            <h2>React</h2>
            <div id="react-datatable"></div>
        </section>

        <script type="module">
            // The server's half: the rows written into the markup before the
            // table is attached, the way kyu and Almanac render them.
            import { INCIDENTS } from '/tests/fixtures/datatable-data.mjs';
            import { attachDataTables } from '/js/datatable.js';

            const cell = (label, text) => {
                const td = document.createElement('td');
                td.dataset.label = label;
                td.textContent = text;
                return td;
            };
            const badge = (label, text) => {
                const td = cell(label, '');
                const span = document.createElement('span');
                span.className = 'kp-badge';
                span.textContent = text;
                td.append(span);
                return td;
            };
            const body = document.querySelector('[data-fixture-rows]');
            const short = document.querySelector('[data-fixture-short-rows]');
            for (const row of INCIDENTS) {
                const tr = document.createElement('tr');
                tr.dataset.kpRowKey = row.ref;
                const box = document.createElement('input');
                box.type = 'checkbox';
                box.dataset.kpSelectRow = '';
                box.setAttribute('aria-label', `Select ${row.ref}`);
                const first = cell('', '');
                first.append(box);
                tr.append(
                    first,
                    cell('Reference', row.ref),
                    cell('Site', row.site),
                    badge('Status', row.status),
                    cell('Severity', row.severity),
                    cell('Hours', String(row.hours)),
                    cell('Opened', row.opened),
                    cell('Note', row.note),
                );
                body.append(tr);
                const s = document.createElement('tr');
                s.dataset.kpRowKey = row.ref;
                s.append(cell('Reference', row.ref), cell('Site', row.site), badge('Status', row.status), cell('Note', row.note));
                short.append(s);
            }

            const detach = attachDataTables(document.getElementById('plain'));
            const [main, sticky] = detach.handles;
            // A first load, as a page that fetches its rows sees it: no rows
            // while loading, the rows back when the answer arrives. The
            // React half does the same by passing no rows.
            let saved = null;
            window.kpFixture = {
                ...window.kpFixture,
                plain: {
                    rowKeys: () => main.rows().map((row) => row.dataset.kpRowKey),
                    pageKeys: () => main.rows('page').map((row) => row.dataset.kpRowKey),
                    state: (next) => {
                        if (next === 'loading' && saved === null) {
                            saved = [...body.rows];
                            body.replaceChildren();
                            main.refresh();
                        } else if (next !== 'loading' && saved !== null) {
                            body.append(...saved);
                            saved = null;
                            main.refresh();
                        }
                        main.state(next);
                    },
                    sticky,
                },
            };
        </script>
        <script type="module" src="/tests/fixtures/.build/react-datatable.js"></script>
    </body>
</html>
