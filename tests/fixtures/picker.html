<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Theme picker — both channels</title>
        <!-- The no-flash snippet, inline and before the stylesheet, exactly
             as a server-rendered consumer would paste it [TH23]. -->
        <script>
            (function () {
                try {
                    var t = localStorage.getItem('theme');
                    if (t) document.documentElement.dataset.theme = t;
                } catch (e) {}
            })();
        </script>
        <link rel="stylesheet" href="/css/themes.css" />
        <link rel="stylesheet" href="/css/components.css" />
    </head>
    <body>
        <h1>Two pickers, one document</h1>

        <!-- Channel A: framework-free. Markup a server wrote; the script
             only attaches behaviour to it [T1]. -->
        <section>
            <h2>Framework-free</h2>
            <div data-kp-theme-picker id="plain">
                <!-- filled by the fixture script below, from the generated
                     registry, so this page cannot disagree with the tokens -->
            </div>
            <p data-kp-theme-status hidden></p>
        </section>

        <!-- Channel B: React, mounted from a bundle. -->
        <section>
            <h2>React</h2>
            <div id="react-mount"></div>
        </section>

        <script type="module">
            // Grouped light and dark, from the module, so this page cannot
            // disagree with the tokens about which is which [TH63].
            const { attachThemePickers, themeOptionsMarkup } = await import('/js/theme-picker.js');
            document.getElementById('plain').innerHTML = themeOptionsMarkup();

            // Pure since 3.0.0 [KT6]: the module attaches nothing on import.
            // The consumer calls attach once the options exist.
            attachThemePickers();
        </script>
        <script type="module" src="/tests/fixtures/.build/react-mount.js"></script>
    </body>
</html>
