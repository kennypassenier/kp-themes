<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>kp-themes — Sign in</title>
        <script>
            (function () {
                try {
                    var t = localStorage.getItem("theme");
                    if (t) document.documentElement.setAttribute("data-theme", t);
                    document.documentElement.setAttribute("data-kp-effects", '');
                } catch (e) {}
            })();
        </script>
        <link rel="stylesheet" href="../css/fonts.css" />
        <link rel="stylesheet" href="../css/themes.css" />
        <link rel="stylesheet" href="../css/components.css" />
        <link rel="stylesheet" href="../css/layout.css" />
        <link rel="stylesheet" href="../css/utilities.css" />
        <link rel="stylesheet" href="../css/cyberpunk-register.css" />
        <link rel="stylesheet" href="../css/retro-register.css" />
        <link rel="stylesheet" href="../css/synthwave-register.css" />
        <link rel="stylesheet" href="../css/phantom-register.css" />
        <link rel="stylesheet" href="../css/terminal-register.css" />
        <link rel="stylesheet" href="../css/brutalism-register.css" />
        <link rel="stylesheet" href="../css/nostromo-register.css" />
        <link rel="stylesheet" href="../css/dark-register.css" />
        <link rel="stylesheet" href="../css/academia-register.css" />
        <link rel="stylesheet" href="../css/formal-register.css" />
        <link rel="stylesheet" href="../css/sepia-register.css" />
        <link rel="stylesheet" href="../css/solstice-register.css" />
        <link rel="stylesheet" href="../css/mono-register.css" />
        <link rel="stylesheet" href="../css/high-contrast-register.css" />
        <link rel="stylesheet" href="../css/tazhib-register.css" />
        <link rel="stylesheet" href="../css/shade-dark-register.css" />
    </head>
    <body>
        <a class="kp-skip-link" href="#main">Skip to the content</a>
        <div class="kp-nav-wrap">
            <nav class="kp-nav" aria-label="Main navigation">
                <span class="kp-nav__brand">Northwind</span>
                <ul class="kp-nav__links">
                    <li>
                        <a class="kp-nav__link" href="#overview" aria-current="page" data-kp-text="Overview">Overview</a>
                    </li>
                    <li>
                        <a class="kp-nav__link" href="#invoices" data-kp-text="Invoices">Invoices</a>
                    </li>
                    <li>
                        <a class="kp-nav__link" href="#reports" data-kp-text="Reports">Reports</a>
                    </li>
                    <li>
                        <a class="kp-nav__link" href="#settings" data-kp-text="Settings">Settings</a>
                    </li>
                </ul>
            </nav>
        </div>
        <main id="main" class="kp-page" tabindex="-1">
            <div class="kp-stack">
                <div class="kp-center kp-stack">
                    <h1>Sign in</h1>
                    <div class="kp-alert kp-alert--info" role="status" data-kp-semantic>
                        <span class="kp-alert__body">
                            <span class="kp-alert__label">Info:</span>
                            Your session expired. Sign in again to pick up where you left off.
                        </span>
                    </div>
                    <form class="kp-stack">
                        <div class="kp-field">
                            <label class="kp-field__label" for="login-email">
                                Email
                                <span class="kp-field__required">required</span>
                            </label>
                            <input id="login-email" class="kp-field__input" type="email" autocomplete="username" required>
                        </div>
                        <div class="kp-field">
                            <label class="kp-field__label" for="login-password">
                                Password
                                <span class="kp-field__required">required</span>
                            </label>
                            <input id="login-password" class="kp-field__input" type="password" autocomplete="current-password" aria-describedby="login-password-help" required>
                            <span class="kp-field__help" id="login-password-help">At least twelve characters.</span>
                        </div>
                        <div class="kp-field kp-field--check">
                            <input class="kp-field__check" id="login-remember" type="checkbox">
                            <label class="kp-field__label" for="login-remember">Keep me signed in</label>
                        </div>
                        <button type="submit" class="kp-button kp-button--primary kp-w-full">
                            <span class="kp-button__label">Sign in</span>
                        </button>
                    </form>
                    <p class="kp-text-muted">
                        <a href="#reset">Forgotten your password?</a>
                    </p>
                </div>
            </div>
        </main>
        <script type="module" src="../js/auto.js"></script>
    </body>
</html>
