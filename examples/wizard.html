<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>kp-themes — Wizard</title>
        <script>
            (function () {
                try {
                    var t = localStorage.getItem("theme");
                    if (t) document.documentElement.setAttribute("data-theme", t);
                    document.documentElement.setAttribute("data-kp-effects", '');
                } catch (e) {}
            })();
        </script>
        <link rel="stylesheet" href="../css/fonts.css" />
        <link rel="stylesheet" href="../css/themes.css" />
        <link rel="stylesheet" href="../css/components.css" />
        <link rel="stylesheet" href="../css/layout.css" />
        <link rel="stylesheet" href="../css/utilities.css" />
        <link rel="stylesheet" href="../css/cyberpunk-register.css" />
        <link rel="stylesheet" href="../css/retro-register.css" />
        <link rel="stylesheet" href="../css/synthwave-register.css" />
        <link rel="stylesheet" href="../css/phantom-register.css" />
        <link rel="stylesheet" href="../css/terminal-register.css" />
        <link rel="stylesheet" href="../css/brutalism-register.css" />
        <link rel="stylesheet" href="../css/shade-dark-register.css" />
    </head>
    <body>
        <a class="kp-skip-link" href="#main">Skip to the content</a>
        <div class="kp-nav-wrap">
            <nav class="kp-nav" aria-label="Main navigation">
                <span class="kp-nav__brand">Northwind</span>
                <ul class="kp-nav__links">
                    <li>
                        <a class="kp-nav__link" href="#overview" aria-current="page" data-kp-text="Overview">Overview</a>
                    </li>
                    <li>
                        <a class="kp-nav__link" href="#invoices" data-kp-text="Invoices">Invoices</a>
                    </li>
                    <li>
                        <a class="kp-nav__link" href="#reports" data-kp-text="Reports">Reports</a>
                    </li>
                    <li>
                        <a class="kp-nav__link" href="#settings" data-kp-text="Settings">Settings</a>
                    </li>
                </ul>
            </nav>
        </div>
        <main id="main" class="kp-page" tabindex="-1">
            <div class="kp-stack">
                <h1>New project</h1>
                <div class="kp-wizard" data-kp-wizard data-example="steps">
                    <ol class="kp-wizard__steps" data-kp-wizard-steps>
                        <li data-kp-step-label>Basics</li>
                        <li data-kp-step-label>Team</li>
                        <li data-kp-step-label>Review</li>
                    </ol>
                    <section data-kp-step>
                        <div class="kp-card" data-slot="card">
                            <div class="kp-card__header">
                                <h3 class="kp-card__title">Basics</h3>
                            </div>
                            <div class="kp-card__body">
                                <div class="kp-stack">
                                    <div class="kp-field">
                                        <label class="kp-field__label" for="wizard-name">Project name</label>
                                        <input id="wizard-name" class="kp-field__input" type="text" value="Analytical Engine">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                    <section data-kp-step hidden="true">
                        <div class="kp-card" data-slot="card">
                            <div class="kp-card__header">
                                <h3 class="kp-card__title">Team</h3>
                            </div>
                            <div class="kp-card__body">
                                <div class="kp-stack">
                                    <p class="kp-text-muted kp-prose">Everyone here can see the project. You can change this afterwards.</p>
                                    <div class="kp-field">
                                        <label class="kp-field__label" for="wizard-owner">Owner</label>
                                        <input id="wizard-owner" class="kp-field__input" type="text" value="Ada Lovelace">
                                    </div>
                                    <div class="kp-field">
                                        <label class="kp-field__label" for="wizard-invite">Invite by email</label>
                                        <input id="wizard-invite" class="kp-field__input" type="email" aria-describedby="wizard-invite-help">
                                        <span class="kp-field__help" id="wizard-invite-help">One address per line.</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                    <section data-kp-step hidden="true">
                        <div class="kp-card" data-slot="card">
                            <div class="kp-card__header">
                                <h3 class="kp-card__title">Review</h3>
                            </div>
                            <div class="kp-card__body">
                                <p class="kp-text-muted kp-prose">Nothing is created until you press Finish on this step.</p>
                            </div>
                        </div>
                    </section>
                    <div class="kp-wizard__actions kp-row kp-row--between">
                        <button data-kp-wizard-back type="button" class="kp-button">
                            <span class="kp-button__label">Back</span>
                        </button>
                        <button data-kp-wizard-next type="button" class="kp-button kp-button--primary">
                            <span class="kp-button__label">Next</span>
                        </button>
                    </div>
                </div>
            </div>
        </main>
        <script type="module" src="../js/auto.js"></script>
    </body>
</html>
