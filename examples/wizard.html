<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>kp-themes — Wizard</title>
        <link rel="stylesheet" href="../css/themes.css" />
        <link rel="stylesheet" href="../css/components.css" />
        <link rel="stylesheet" href="../css/layout.css" />
        <link rel="stylesheet" href="../css/utilities.css" />
    </head>
    <body>
        <a class="kp-skip-link" href="#main">Skip to the content</a>
        <nav class="kp-nav" aria-label="Main navigation">
            <span class="kp-nav__brand">Northwind</span>
            <ul class="kp-nav__links">
                <li>
                    <a class="kp-nav__link" href="#overview" aria-current="page">Overview</a>
                </li>
                <li>
                    <a class="kp-nav__link" href="#invoices">Invoices</a>
                </li>
                <li>
                    <a class="kp-nav__link" href="#reports">Reports</a>
                </li>
                <li>
                    <a class="kp-nav__link" href="#settings">Settings</a>
                </li>
            </ul>
        </nav>
        <main id="main" class="kp-page" tabindex="-1">
            <div class="kp-stack">
                <h1>New project</h1>
                <div class="kp-row kp-gap-sm" data-example="steps">
                    <span class="kp-badge">1. Basics</span>
                    <span class="kp-badge kp-fw-semibold" aria-current="step">2. Team</span>
                    <span class="kp-badge kp-text-muted">3. Review</span>
                </div>
                <div class="kp-card" data-slot="card">
                    <div class="kp-card__header">
                        <h3 class="kp-card__title">Team</h3>
                    </div>
                    <div class="kp-card__body">
                        <form class="kp-stack">
                            <p class="kp-text-muted kp-prose">Everyone here can see the project. You can change this afterwards.</p>
                            <div class="kp-field">
                                <label class="kp-field__label" for="wizard-owner">Owner</label>
                                <input id="wizard-owner" class="kp-field__input" type="text" value="Ada Lovelace">
                            </div>
                            <div class="kp-field">
                                <label class="kp-field__label" for="wizard-invite">Invite by email</label>
                                <input id="wizard-invite" class="kp-field__input" type="email" aria-describedby="wizard-invite-help">
                                <span class="kp-field__help" id="wizard-invite-help">One address per line.</span>
                            </div>
                            <div class="kp-row kp-row--between">
                                <button type="button" class="kp-button">Back</button>
                                <button type="submit" class="kp-button kp-button--primary">Next</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
        <script type="module" src="../js/auto.js"></script>
    </body>
</html>
