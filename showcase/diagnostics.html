<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>kp-themes — diagnostics</title>
        <link rel="stylesheet" href="../css/themes.css" />
        <link rel="stylesheet" href="../css/components.css" />
        <style>
/* The showcase's own furniture — inlined into both generated
               pages so a fixture is one file plus the package's stylesheets.
               Everything here reads tokens; nothing here is a colour. */
/* No font-family here on purpose. It used to carry one, which meant the
 * per-theme fixture pages set their own body face — so the TH12 test
 * measured this file rather than the package, and went on passing with
 * the package's own rule deleted. The face comes from css/_rules.css now,
 * which is the thing a consumer installs. */
body {
    margin: 0;
    line-height: 1.5;
}

/* Each block resolves its OWN theme's typeface.
 *
 * Without this line the font came from `body`, which resolves against the
 * document's theme — so a terminal block showed terminal's colours in a
 * sans-serif face while the document was formal, and every block turned
 * monospace the moment someone picked terminal. Terminal's anatomy
 * document is explicit that losing the mono face makes it "green-tinted,
 * not a terminal", so the page was showing something that is not the
 * theme it claims to be. Found by Kenny on the published page. */
.sc-theme {
    font-family: var(--theme-font-body, system-ui, sans-serif);
}

/* The header wears the document's theme, which is what makes the picker
 * in it visibly do something — every block below keeps its own. */
.sc-header {
    padding: 1.5rem clamp(1rem, 4vw, 3rem);
    background: var(--background);
    color: var(--foreground);
}

/* The header's prose is the SHOWCASE speaking, not a specimen [gap-2,
   Kenny 2026-09-12: "vastzetten op de pagina"].
   
   It used to wrap in whatever face and scale the document's theme set, so
   its height ran from 347px under titanium to 445px under terminal —
   and everything below it, the theme picker included, moved by those 98
   pixels. A control you reach for by muscle memory should not depend on
   which theme is showing.
   
   The colours and the heading still wear the theme, which is what makes
   the picker visibly do something. Only the measure and the scale of the
   two paragraphs are the page's own, so the geometry stands still. */
.sc-header > p {
    max-width: 48rem;
    font-family: system-ui, sans-serif;
    font-size: 0.95rem;
    line-height: 1.55;
}

/* The title keeps the theme's own display face — that is half of what
   makes switching visible — but not the theme's own share of the page's
   height [gap-2]. Measured 2026-09-12 in firefox across the twenty-two:
   the heading's own box runs from 30.4px under cyberpunk to 48px under
   dark, and that 17.6px was the whole of the picker's remaining drift
   once the prose was pinned.

   Three rem held twenty-one of them and left retro 13px out on its own —
   its display face measures 57.6px where dark's is 48. Four rem holds
   every one, and the heading is centred in that box so a short face does
   not sit high in it.

   `box-sizing: border-box` because retro was STILL 13px out at four rem:
   its base register paints a title bar behind every h1, and that padding
   sat outside a content-box height. Measured 73.6px against a declared
   64. The same trap the side navigation's width knob fell into in stage
   one — a height that names the content is not a height. */
.sc-header h1 {
    margin: 0;
    display: flex;
    align-items: center;
    box-sizing: border-box;
    block-size: 4rem;
}

.sc-header__top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 0.5rem;
}

.sc-theme {
    padding: 1.5rem clamp(1rem, 4vw, 3rem) 2.5rem;
    background: var(--background);
    color: var(--foreground);
}

/* The comparison page [TH88]: two halves in one grid. A pane is
 * `display: contents`, so its specimens become grid items of the shared
 * grid and a specimen on the left sits in the same row as its twin on the
 * right — the halves cannot drift apart while the page scrolls as one.
 * Theme tokens still inherit from the pane's data-theme; only its box is
 * gone, so the cells paint the ground themselves. */
.sc-panes {
    display: grid;
    grid-template-columns: 1fr 1fr;
}

.sc-pane {
    display: contents;
}

.sc-cell {
    padding: 1rem clamp(1rem, 3vw, 2.5rem);
    background: var(--background);
    color: var(--foreground);
    font-family: var(--theme-font-body, system-ui, sans-serif);
    min-width: 0;
}

.sc-side {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding-top: 0.75rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border-strong);
}

.sc-side__name {
    margin: 0;
    font-size: 1.25rem;
}

/* The menu scrolls inside itself under the sticky bar; the package's
 * .kp-popover carries that rule since R5, this only tightens it. */
.sc-side .kp-popover {
    --kp-popover-max-height: min(70vh, 40rem);
}

/* Side by side needs width; below it the right half steps aside rather
 * than stacking, because stacked halves are the page this replaced. */
@media (max-width: 48rem) {
    .sc-panes {
        grid-template-columns: 1fr;
    }

    .sc-pane[data-sc-side='right'] {
        display: none;
    }
}

.sc-theme > h2 {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    margin: 0 0 1rem;
    border-bottom: 1px solid var(--border-strong);
    padding-bottom: 0.5rem;
}

.sc-theme > h2 small {
    font-size: 0.75rem;
    font-weight: normal;
    color: var(--muted-foreground);
}

.sc-specimen {
    margin: 0 0 1.75rem;
}

.sc-specimen h3 {
    margin: 0 0 0.25rem;
    font-size: 1rem;
}

.sc-note {
    margin: 0 0 0.75rem;
    color: var(--muted-foreground);
    font-size: 0.875rem;
    max-width: 60ch;
}

/* auto-fit, not a fixed column count: this is what keeps the
               page off a horizontal scrollbar at 320 px [DI11]. */
.sc-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
    gap: 0.5rem;
}

.sc-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
}

.sc-chip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    /* min-height, never height: a reading aid that raises line
                   height must be able to make this taller instead of
                   clipping the label [DI11]. */
    min-height: 2.5rem;
    padding: 0.5rem 0.625rem;
    border: 1px solid var(--border);
    border-radius: var(--radius, 0.5rem);
    font-size: 0.8125rem;
}

.sc-states {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
}

.sc-badge {
    display: inline-block;
    padding: 0.125rem 0.5rem;
    border-radius: 999px;
    font-size: 0.8125rem;
}

.sc-button {
    min-height: 2.25rem;
    padding: 0.375rem 0.875rem;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius, 0.5rem);
    background: var(--card);
    color: var(--card-foreground);
    font: inherit;
    cursor: pointer;
}

.sc-on-primary {
    background: var(--primary);
    color: var(--primary-foreground);
    border-color: var(--primary);
}

.sc-on-destructive {
    background: var(--destructive);
    color: var(--destructive-foreground);
    border-color: var(--destructive);
}

.sc-text {
    max-width: 60ch;
}

.sc-picker {
    margin-bottom: 0.5rem;
}
        </style>
    </head>
    <body>
        <main class="sc-theme" id="kp-diagnostics"></main>
        <script type="module">
            import { renderDiagnostics } from '../js/diagnostics.js';
            renderDiagnostics(document.getElementById('kp-diagnostics'));
        </script>
    </body>
</html>
